    # ── Repo 6: interacting_with_kafka ────────────────────────────────────
    - id: check-kafka
      name: Check if interacting_with_kafka already set up
      action: catalog:fetch
      input:
        optional: true
        entityRef: "component:default/workshop-quarkus-interacting_with_kafka"

    - id: fetch-kafka
      name: Fetch interacting_with_kafka
      action: fetch:plain
      if: ${{ not steps['check-kafka'].output.entity }}
      input:

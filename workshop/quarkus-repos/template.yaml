apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: clone-workshop-repos
  title: Clone Workshop Repos to My GitLab
  description: >
    Clones all 6 Quarkus workshop repositories from GitHub into your personal
    private GitLab namespace. Run this once at the start of the workshop.
    Safe to re-run — already-created repos are skipped automatically.
  tags:
    - workshop
    - quarkus
    - gitlab
spec:
  owner: workshop-admins
  type: service

  parameters: []

  steps:
    # ── Repo 1: hello_quarkus ──────────────────────────────────────────────
    - id: check-hello-quarkus
      name: Check if hello_quarkus already set up
      action: catalog:fetch
      input:
        optional: true
        entityRef: "component:default/workshop-quarkus-hello_quarkus"

    - id: fetch-hello-quarkus
      name: Fetch hello_quarkus
      action: fetch:plain
      if: ${{ not steps['check-hello-quarkus'].output.entity }}
      input:
        url: https://gitea.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/workshop-source/workshop-quarkus-hello_quarkus/src/branch/main
        targetPath: ./workshop-quarkus-hello_quarkus

    - id: catalog-hello-quarkus
      name: Add catalog-info to hello_quarkus
      action: fetch:template
      if: ${{ not steps['check-hello-quarkus'].output.entity }}
      input:
        url: ./skeleton
        targetPath: ./workshop-quarkus-hello_quarkus
        values:
          repoName: workshop-quarkus-hello_quarkus
          title: hello_quarkus
          gitlabUsername: ${{ user.entity.metadata.name }}
          devspacesUrl: "https://devspaces.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/#https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-hello_quarkus"

    - id: publish-hello-quarkus
      name: Publish hello_quarkus → GitLab
      action: publish:gitlab
      if: ${{ not steps['check-hello-quarkus'].output.entity }}
      input:
        repoUrl: "gitlab.com?owner=${{ user.entity.metadata.name }}&repo=workshop-quarkus-hello_quarkus"
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./workshop-quarkus-hello_quarkus

    - id: register-hello-quarkus
      name: Register hello_quarkus in catalog
      action: catalog:register
      if: ${{ not steps['check-hello-quarkus'].output.entity }}
      input:
        catalogInfoUrl: "https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-hello_quarkus/-/blob/main/catalog-info.yaml"

    # ── Repo 2: using_camel ────────────────────────────────────────────────
    - id: check-using-camel
      name: Check if using_camel already set up
      action: catalog:fetch
      input:
        optional: true
        entityRef: "component:default/workshop-quarkus-using_camel"

    - id: fetch-using-camel
      name: Fetch using_camel
      action: fetch:plain
      if: ${{ not steps['check-using-camel'].output.entity }}
      input:
        url: https://gitea.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/workshop-source/workshop-quarkus-using_camel/src/branch/main
        targetPath: ./workshop-quarkus-using_camel

    - id: catalog-using-camel
      name: Add catalog-info to using_camel
      action: fetch:template
      if: ${{ not steps['check-using-camel'].output.entity }}
      input:
        url: ./skeleton
        targetPath: ./workshop-quarkus-using_camel
        values:
          repoName: workshop-quarkus-using_camel
          title: using_camel
          gitlabUsername: ${{ user.entity.metadata.name }}
          devspacesUrl: "https://devspaces.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/#https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-using_camel"

    - id: publish-using-camel
      name: Publish using_camel → GitLab
      action: publish:gitlab
      if: ${{ not steps['check-using-camel'].output.entity }}
      input:
        repoUrl: "gitlab.com?owner=${{ user.entity.metadata.name }}&repo=workshop-quarkus-using_camel"
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./workshop-quarkus-using_camel

    - id: register-using-camel
      name: Register using_camel in catalog
      action: catalog:register
      if: ${{ not steps['check-using-camel'].output.entity }}
      input:
        catalogInfoUrl: "https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-using_camel/-/blob/main/catalog-info.yaml"

    # ── Repo 3: using_funqy_stateless_events ──────────────────────────────
    - id: check-funqy
      name: Check if using_funqy_stateless_events already set up
      action: catalog:fetch
      input:
        optional: true
        entityRef: "component:default/workshop-quarkus-using_funqy_stateless_events"

    - id: fetch-funqy
      name: Fetch using_funqy_stateless_events
      action: fetch:plain
      if: ${{ not steps['check-funqy'].output.entity }}
      input:
        url: https://gitea.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/workshop-source/workshop-quarkus-using_funqy_stateless_events/src/branch/main

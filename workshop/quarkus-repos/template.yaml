    - id: publish-kafka
      name: Publish interacting_with_kafka → GitLab
      action: publish:gitlab
      if: ${{ not steps['check-kafka'].output.entity }}
      input:
        repoUrl: "gitlab.com?owner=${{ user.entity.metadata.name }}&repo=workshop-quarkus-interacting_with_kafka"
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./workshop-quarkus-interacting_with_kafka

    - id: register-kafka
      name: Register interacting_with_kafka in catalog
      action: catalog:register
      if: ${{ not steps['check-kafka'].output.entity }}
      input:
        catalogInfoUrl: "https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-interacting_with_kafka/-/blob/main/catalog-info.yaml"

  output:
    links:
      - title: hello_quarkus
        url: ${{ steps['publish-hello-quarkus'].output.remoteUrl }}
      - title: using_camel
        url: ${{ steps['publish-using-camel'].output.remoteUrl }}
      - title: using_funqy_stateless_events
        url: ${{ steps['publish-funqy'].output.remoteUrl }}
      - title: blue_green_deployments_openshift
        url: ${{ steps['publish-blue-green'].output.remoteUrl }}
      - title: openshift_telemetry_with_micrometer
        url: ${{ steps['publish-telemetry'].output.remoteUrl }}
      - title: interacting_with_kafka
        url: ${{ steps['publish-kafka'].output.remoteUrl }}

---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-helpers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-helpers
  namespace: workshop-helpers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get"]
  - apiGroups: ["rhdh.redhat.com"]
    resources: ["backstages"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-helpers
subjects:
  - kind: ServiceAccount
    name: workshop-helpers
    namespace: workshop-helpers

---
# Runs every minute — provisions per-user repos in Gitea
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-user-repos-gitea
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: python:3.11
              env:
                - name: GITEA_URL
                  value: "https://gitea.apps.rosa.rosa-w67wp.bhg0.p3.openshiftapps.com"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  pip install --quiet --target /tmp/pylib requests pyyaml urllib3 && export PYTHONPATH=/tmp/pylib && \
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/provision-user-repos-gitea.py

---
# Runs every minute — registers per-user catalog URLs in RHDH
apiVersion: batch/v1
kind: CronJob
metadata:
  name: register-rhdh-catalog-gitea
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: register
              image: python:3.11
              env:
                - name: GITEA_URL
                  value: "https://gitea.apps.rosa.rosa-w67wp.bhg0.p3.openshiftapps.com"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  pip install --quiet --target /tmp/pylib requests pyyaml urllib3 && export PYTHONPATH=/tmp/pylib && \
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/register-rhdh-catalog-gitea.py

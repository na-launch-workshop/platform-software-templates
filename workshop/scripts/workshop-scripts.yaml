---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-helpers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-helpers
  namespace: workshop-helpers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["system:image-pusher", "admin"]
  - apiGroups: ["tekton.dev"]
    resources: ["tasks", "pipelines"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get"]
  - apiGroups: ["rhdh.redhat.com"]
    resources: ["backstages"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-helpers
subjects:
  - kind: ServiceAccount
    name: workshop-helpers
    namespace: workshop-helpers

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-user-repos-gitlab
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: image-registry.openshift-image-registry.svc:5000/workshop-helpers/workshop-helper:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/provision-user-repos-gitlab.py




---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-helm-releases
  namespace: workshop-helpers
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 170
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: image-registry.openshift-image-registry.svc:5000/workshop-helpers/workshop-helper:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/provision-helm-releases.py

#   ------------------------------------------------
#   TO USE
#   oc apply -f ./workshop-scripts.yaml

#   TO REMOVE
#   oc delete namespace workshop-helpers
#   oc delete clusterrole workshop-helpers
#   oc delete clusterrolebinding workshop-helpers
#   ------------------------------------------------

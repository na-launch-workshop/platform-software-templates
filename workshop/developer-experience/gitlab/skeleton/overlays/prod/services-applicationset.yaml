apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-applicationset
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: ${{ values.gitlabRemoteUrl }}.git
        revision: HEAD
        directories:
          - path: services/*/*/overlays/prod
        values:
          service: "{{index .path.segments 1}}-{{index .path.segments 2}}"
          userNamespace: "{{index .path.segments 1}}-devspaces"
          serviceName: "{{index .path.segments 2}}"
  template:
    metadata:
      name: "{{.values.service}}-service"
    spec:
      project: default
      source:
        repoURL: ${{ values.gitlabRemoteUrl }}.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        kustomize:
          commonLabels:
            env: '{{.path.basename}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ if eq .values.serviceName "kafka-instance" }}{{ .values.userNamespace }}{{ else }}{{ .values.service }}{{ end }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: "openshift-gitops"
        syncOptions:
          - CreateNamespace=true
          - Validate=false

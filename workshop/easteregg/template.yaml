apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: easter-egg-template
  title: Easter Egg Template
  description: You've found an easter egg!  This template creates a new Git repository initialized with a secret README.
  tags:
    - git
    - developers
    - easteregg
spec:
  owner: group:default/developers
  type: service

  parameters:
    - title: Egg Configuration
      required:
        - eggName
        - secretMessage
        - sourceControlProvider
      properties:
        eggName:
          title: Egg Name
          type: string
          description: The name of your secret Git repository
          maxLength: 40
          pattern: '^([a-zA-Z][a-zA-Z0-9]*)(-[a-zA-Z0-9]+)*$'
          ui:autofocus: true
          ui:help: 'Hint: alphanumeric tokens (first starts with letter) delimited by -'
        secretMessage:
          title: The Secret
          type: string
          description: The hidden message inside the README.
          ui:widget: textarea
        sourceControlProvider:
          title: Select source control provider
          description: Choose your source control provider
          type: string
          enum:
            - GitLab
            - Gitea

  steps:

    ###################################
    ## Fetch Available ArgoCD Instances
    ###################################
    - action: catalog:fetch
      id: fetchArgoCDInstances
      name: Fetch ArgoCD Instances
      input:
        entityRef: resource:default/argocd-instances
  
    - id: fetch-template
      name: Generating Egg Shell
      action: fetch:template
      input:
        url: ./skeleton # Assumes a local folder with a README.md.njk
        values:
          name: ${{ parameters.eggName }}
          owner: user:default/${{ user.entity.metadata.name }}
          secretMessage: ${{ parameters.secretMessage }}
    
    - id: create-empty-gitlab-repo
      name: Create an Empty GitLab Repository
      action: publish:gitlab
      if: ${{ parameters.sourceControlProvider == 'GitLab' }}
      input:
        repoUrl: "gitlab.com?owner=developers&repo=${{ parameters.eggName }}"
        defaultBranch: main
        settings:
          visibility: internal
        branches:
          - name: main
            protect: true

    - id: publish-to-gitlab
      name: Hiding the Egg in GitLab
      action: gitlab:repo:push
      if: ${{ parameters.sourceControlProvider == 'GitLab' }}
      input:
        repoUrl: gitlab.com?owner=developers&repo=${{ parameters.eggName }}"
        branchName: main
        commitAction: create
        commitMessage: Initial commit

    - id: register
      name: Registering GitLab Repo in Catalog
      action: catalog:register
      if: ${{ parameters.sourceControlProvider == 'GitLab' }}
      input:
        repoContentsUrl: ${{ steps['publish-to-gitlab'].output.repoContentsUrl }}
        catalogInfoPath: catalog-info.yaml

    - id: publish-to-gitea
      name: Hiding the Egg in Gitea
      action: publish:gitea
      if: ${{ parameters.sourceControlProvider == 'Gitea' }}
      input:
        description: "A hidden surprise: ${{ parameters.eggName }}"
        repoUrl: "gitea.${{ steps['fetchArgoCDInstances'].output.entity.spec.services.domain }}?owner=developers&repo=${{ parameters.eggName }}"
        defaultBranch: main

    - id: register
      name: Registering Gitea Repo in Catalog
      action: catalog:register
      if: ${{ parameters.sourceControlProvider == 'Gitea' }}
      input:
        repoContentsUrl: ${{ steps['publish-to-gitea'].output.repoContentsUrl }}
        catalogInfoPath: catalog-info.yaml

  output:
    links:
      - title: View source code for new easter egg
        url: >
          {% if parameters.sourceControlProvider == 'GitLab' -%}
            ${{ steps['publish-to-gitlab'].output.repoContentsUrl }}
          {%- else -%}
            ${{ steps['publish-to-gitea'].output.repoContentsUrl }}
          {%- endif %}
      - title: Open Easter Egg in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-helpers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-helpers
  namespace: workshop-helpers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get"]
  - apiGroups: ["rhdh.redhat.com"]
    resources: ["backstages"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-helpers
subjects:
  - kind: ServiceAccount
    name: workshop-helpers
    namespace: workshop-helpers

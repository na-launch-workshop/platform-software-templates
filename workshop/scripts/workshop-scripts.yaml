---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-helpers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-helpers
  namespace: workshop-helpers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["system:image-pusher", "admin"]
  - apiGroups: ["tekton.dev"]
    resources: ["tasks", "pipelines"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get"]
  - apiGroups: ["rhdh.redhat.com"]
    resources: ["backstages"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas"]
    verbs: ["get", "list", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-helpers
subjects:
  - kind: ServiceAccount
    name: workshop-helpers
    namespace: workshop-helpers

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-user-repos-gitlab
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: python:3.11
              command: ["/bin/bash", "-c"]
              args:
                - |
                  pip install --quiet --target /tmp/pylib requests pyyaml urllib3 && export PYTHONPATH=/tmp/pylib && \
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/provision-user-repos-gitlab.py




---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-helm-releases
  namespace: workshop-helpers
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: python:3.11
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -e

                  # Download oc and helm
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc
                  curl -fsSL https://get.helm.sh/helm-v3.14.3-linux-amd64.tar.gz \
                    | tar xz -C /tmp && mv /tmp/linux-amd64/helm /tmp/helm
                  export PATH=/tmp:$PATH

                  # Get Keycloak users from developers group
                  KC_HOST=$(oc get route keycloak -n keycloak -o jsonpath='{.spec.host}')
                  KC_PASS=$(oc get secret credential-keycloak -n keycloak -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d)
                  KC_TOKEN=$(curl -sk -X POST "https://${KC_HOST}/auth/realms/master/protocol/openid-connect/token" \
                    -d "client_id=admin-cli&grant_type=password&username=admin&password=${KC_PASS}" \
                    | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
                  GROUP_ID=$(curl -sk "https://${KC_HOST}/auth/admin/realms/openshift/groups" \
                    -H "Authorization: Bearer ${KC_TOKEN}" \
                    | python3 -c "import sys,json; print(next(g['id'] for g in json.load(sys.stdin) if g['name']=='developers'))")
                  USERS=$(curl -sk "https://${KC_HOST}/auth/admin/realms/openshift/groups/${GROUP_ID}/members?max=200" \
                    -H "Authorization: Bearer ${KC_TOKEN}" \
                    | python3 -c "import sys,json; [print(u['username']) for u in json.load(sys.stdin) if u['username'] != 'admin']")

                  # Clone chart from workshop_resources repo (chart is at repo root)
                  git clone --depth 1 https://github.com/na-launch-workshop/workshop_resources.git /tmp/chart-source

                  # For each user, install helm release if namespace exists and release not already deployed
                  for USER in $USERS; do
                    NS="${USER}-devspaces"

                    if ! oc get namespace $NS &>/dev/null; then
                      echo "  $NS: namespace not found, skipping"
                      continue
                    fi

                    echo "  $NS: upgrading..."
                    /tmp/helm upgrade --install workshop-deployer /tmp/chart-source -n $NS \
                      && echo "  $NS: OK" || echo "  $NS: FAILED"
                  done

#   ------------------------------------------------
#   TO USE
#   oc apply -f ./workshop-scripts.yaml

#   TO REMOVE
#   oc delete namespace workshop-helpers
#   oc delete clusterrole workshop-helpers
#   oc delete clusterrolebinding workshop-helpers
#   ------------------------------------------------

---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-helpers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-helpers
  namespace: workshop-helpers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get"]
  - apiGroups: ["rhdh.redhat.com"]
    resources: ["backstages"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-helpers
subjects:
  - kind: ServiceAccount
    name: workshop-helpers
    namespace: workshop-helpers

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-user-repos-gitlab
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: python:3.11
              command: ["/bin/bash", "-c"]
              args:
                - |
                  pip install --quiet --target /tmp/pylib requests pyyaml urllib3 && export PYTHONPATH=/tmp/pylib && \
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/provision-user-repos-gitlab.py

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bootstrap-devspaces-namespaces
  namespace: workshop-helpers
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: bootstrap
              image: python:3.11
              command: ["/bin/bash", "-c"]
              args:
                - |
                  HELM_VERSION="v3.16.4" && \
                  GITLAB_URL="https://gitlab.apps.rosa.rosa-w67wp.bhg0.p3.openshiftapps.com" && \
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  curl -sL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
                    | tar -xz -C /tmp && mv /tmp/linux-amd64/helm /tmp/helm && export PATH=/tmp:$PATH && \
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  GITLAB_PASSWORD="$(oc get secret gitlab-gitlab-initial-root-password -n gitlab-system -o jsonpath='{.data.password}' | base64 -d)" && \
                  GITLAB_TOKEN="$(curl -sk -X POST "${GITLAB_URL}/oauth/token" \
                    -d "grant_type=password" \
                    -d "username=root" \
                    -d "password=${GITLAB_PASSWORD}" \
                    -d "scope=api read_user read_repository write_repository" \
                    | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")" && \
                  git clone --depth 1 "https://oauth2:${GITLAB_TOKEN}@gitlab.apps.rosa.rosa-w67wp.bhg0.p3.openshiftapps.com/developers/workshop-quarkus-using-camel.git" /tmp/workshop-quarkus-using-camel && \
                  python3 /tmp/workspace/workshop/scripts/bootstrap-devspaces-namespaces.py \
                    --helm-chart-dir /tmp/workshop-quarkus-using-camel/helm \
                    --helm-release-name minio

---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-devspaces-namespaces-once
  namespace: workshop-helpers
spec:
  template:
    spec:
      serviceAccountName: workshop-helpers
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.11
          command: ["/bin/bash", "-c"]
          args:
            - |
              HELM_VERSION="v3.16.4" && \
              GITLAB_URL="https://gitlab.apps.rosa.rosa-w67wp.bhg0.p3.openshiftapps.com" && \
              curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
              curl -sL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
                | tar -xz -C /tmp && mv /tmp/linux-amd64/helm /tmp/helm && export PATH=/tmp:$PATH && \
              git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
              GITLAB_PASSWORD="$(oc get secret gitlab-gitlab-initial-root-password -n gitlab-system -o jsonpath='{.data.password}' | base64 -d)" && \
              GITLAB_TOKEN="$(curl -sk -X POST "${GITLAB_URL}/oauth/token" \
                -d "grant_type=password" \
                -d "username=root" \
                -d "password=${GITLAB_PASSWORD}" \
                -d "scope=api read_user read_repository write_repository" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")" && \
              git clone --depth 1 "https://oauth2:${GITLAB_TOKEN}@gitlab.apps.rosa.rosa-w67wp.bhg0.p3.openshiftapps.com/developers/workshop-quarkus-using-camel.git" /tmp/workshop-quarkus-using-camel && \
              python3 /tmp/workspace/workshop/scripts/bootstrap-devspaces-namespaces.py \
                --helm-chart-dir /tmp/workshop-quarkus-using-camel/helm \
                --helm-release-name minio
  backoffLimit: 1





#   ------------------------------------------------
#   TO USE
#   oc apply -f ./workshop-scripts.yaml

#   TO REMOVE
#   oc delete namespace workshop-helpers
#   oc delete clusterrole workshop-helpers
#   oc delete clusterrolebinding workshop-helpers
#   ------------------------------------------------

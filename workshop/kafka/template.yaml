apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kafka-instance
  title: Create Kafka Instance
  description: |
    Deploys a Kafka instance from Developer Hub with Kafka UI, default topic creation,
    and optional KEDA integration on Red Hat OpenShift in a selected namespace.
  tags:
    - gitlab
    - kafka
    - zookeeper
    - kafka-ui
    - keda
    - automation
    - devops
    - self-service
spec:
  owner: developers
  system: self-service
  type: service
  parameters:

    - title: Create a Kafka Instance
      ui:group: instance-config
      required:
        - workshopRepo
        - name
      properties:
        workshopRepo:
          title: Workshop Repository
          type: string
          description: The workshop repository that contains artifact deployment configurations.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
                spec.type: workshop-lab
        name:
          title: Kafka Instance Name
          type: string
          description: The name for the Kafka deployment.
          pattern: "^[a-zA-Z][a-z0-9-]+[A-Za-z0-9]$"
          minLength: 3
          maxLength: 30

    - title: Feature Toggles
      ui:group: features
      properties:
        kafkaUIEnabled:
          title: Enable Kafka UI
          type: boolean
          description: Deploy a web-based Kafka UI for inspecting topics and messages.
          default: true
        topicsEnabled:
          title: Create Default Topics
          type: boolean
          description: Automatically create default Kafka topics (package-receiver, translated-output).
          default: true
        kedaEnabled:
          title: Enable KEDA Topic
          type: boolean
          description: Create a keda-events topic for KEDA-based autoscaling integration.
          default: true

  steps:

    - action: catalog:fetch
      id: fetchWorkshopEntity
      name: Fetch Workshop Repo Entity
      input:
        entityRef: ${{ parameters.workshopRepo }}

    - action: catalog:fetch
      id: fetchArgoCDInstances
      name: Fetch ArgoCD Instances
      input:
        entityRef: resource:default/argocd-instances

    - id: generateOverlays
      name: Generate Kustomize Overlays
      each: ${{ steps['fetchArgoCDInstances'].output.entity.spec.instances }}
      action: fetch:template
      copyWithoutTemplating:
        - kustomization.yaml
      input:
        url: "./skeleton/overlays/${{ each.value.name }}"
        targetPath: "./services/${{ user.entity.metadata.name }}/kafka-instance/overlays/${{ each.value.name }}"

    - id: applicationTemplate
      name: Template Kustomize Base
      action: fetch:template
      input:
        url: "./skeleton/base/"
        targetPath: "./services/${{ user.entity.metadata.name }}/kafka-instance/base"
        values:
          name: ${{ parameters.name }}
          userName: ${{ user.entity.metadata.name }}
          kafkaUIEnabled: ${{ parameters.kafkaUIEnabled }}
          topicsEnabled: ${{ parameters.topicsEnabled }}
          kedaEnabled: ${{ parameters.kedaEnabled }}

    - id: templateKafkaInstanceEntity
      name: Template Kafka Component
      action: fetch:template
      input:
        url: "../../skeletons/backstage/create-kafka-instance"
        targetPath: "backstage/${{ user.entity.metadata.name }}/kafka-instance"
        values:
          name: ${{ parameters.name }}-kafka
          bootstrapService: ${{ parameters.name }}-kafka-bootstrap.${{ user.entity.metadata.name }}-kafka.svc.cluster.local
          kafkaUIEnabled: ${{ parameters.kafkaUIEnabled }}
          owner: |
            ${{ "user:" + user.entity.metadata.namespace + "/" + user.entity.metadata.name if user.entity.metadata.namespace else "default/guest" }}
          rootSelfServiceRepo: ${{ parameters.workshopRepo }}
          devspaces:
            domain: ${{ steps['fetchArgoCDInstances'].output.entity.spec.devspaces.domain }}
          gitlabRemoteUrl: ${{ steps['fetchWorkshopEntity'].output.entity.spec.gitlab.remoteUrl }}

    - id: publishManifests
      name: Publishing to Workshop Repository
      action: gitlab:repo:push
      input:
        description: |
          Publishing Kafka Instance to workshop repository
        repoUrl: gitlab.com?owner=${{ steps['fetchWorkshopEntity'].output.entity.spec.gitlab.owner }}&repo=${{ steps['fetchWorkshopEntity'].output.entity.spec.gitlab.repository }}
        branchName: main
        commitAction: create
        commitMessage: "Created Kafka Instance in folder services/${{ user.entity.metadata.name }}/kafka-instance"

    - id: registerCatalog
      name: "Register Catalog Info"
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['fetchWorkshopEntity'].output.entity.spec.gitlab.remoteUrl }}
        catalogInfoPath: /-/blob/${{ steps['fetchWorkshopEntity'].output.entity.spec.gitlab.branch }}/backstage/${{ user.entity.metadata.name }}/kafka-instance/kafka-instance.yaml

  output:
    links:
      - title: GitLab Repository
        url: ${{ steps['fetchWorkshopEntity'].output.entity.spec.gitlab.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['registerCatalog'].output.entityRef }}
    text:
      - title: "Namespace"
        content: "${{ user.entity.metadata.name }}-kafka-instance"

---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-helpers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-helpers
  namespace: workshop-helpers

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-devspaces-script
  namespace: workshop-helpers
data:
  bootstrap-devspaces-namespaces.py: |
    #!/usr/bin/env python3
    import argparse
    import os
    import string
    import subprocess
    import sys
    from dataclasses import dataclass


    DEFAULT_SELECTOR = (
        "app.kubernetes.io/component=workspaces-namespace,"
        "app.kubernetes.io/part-of=che.eclipse.org"
    )
    DEFAULT_BOOTSTRAP_ANNOTATION = "workshop.redhat.com/devspaces-bootstrap"
    DEFAULT_BOOTSTRAP_VALUE = "done"


    @dataclass
    class DevSpacesNamespace:
        name: str
        username: str
        requester: str
        bootstrap_state: str


    def run_oc(args, *, input_text=None):
        return subprocess.run(
            ["oc", *args],
            input=input_text,
            capture_output=True,
            text=True,
            check=True,
        )


    def list_devspaces_namespaces(selector, annotation_key):
        jsonpath = (
            "{range .items[*]}"
            "{.metadata.name}{'|'}"
            "{.metadata.annotations.che\\.eclipse\\.org/username}{'|'}"
            "{.metadata.annotations.openshift\\.io/requester}{'|'}"
            "{.metadata.annotations."
            + annotation_key.replace("/", "\\/").replace(".", "\\.")
            + "}"
            + "{'\\n'}"
            "{end}"
        )
        result = run_oc(["get", "ns", "-l", selector, "-o", f"jsonpath={jsonpath}"])
        namespaces = []
        for line in result.stdout.splitlines():
            if not line.strip():
                continue
            name, username, requester, bootstrap_state = (line.split("|", 3) + ["", "", "", ""])[:4]
            namespaces.append(
                DevSpacesNamespace(
                    name=name.strip(),
                    username=username.strip(),
                    requester=requester.strip(),
                    bootstrap_state=bootstrap_state.strip(),
                )
            )
        return namespaces


    def collect_yaml_files(manifests_dir):
        if not os.path.isdir(manifests_dir):
            raise FileNotFoundError(f"manifests directory not found: {manifests_dir}")
        files = []
        for root, _, names in os.walk(manifests_dir):
            for name in sorted(names):
                if name.endswith((".yaml", ".yml")):
                    files.append(os.path.join(root, name))
        files.sort()
        if not files:
            raise FileNotFoundError(f"no YAML files found under: {manifests_dir}")
        return files


    def render_manifest(path, namespace):
        with open(path, "r", encoding="utf-8") as handle:
            raw = handle.read()
        template = string.Template(raw)
        return template.safe_substitute(
            USERNAME=namespace.username,
            NAMESPACE=namespace.name,
            DEVSPACES_NAMESPACE=namespace.name,
            DEVSPACES_USER_NAMESPACE=namespace.name,
        )


    def build_manifest_payload(files, namespace):
        rendered_docs = []
        for path in files:
            rendered = render_manifest(path, namespace).strip()
            if rendered:
                rendered_docs.append(rendered)
        return "\n---\n".join(rendered_docs) + "\n"


    def annotate_namespace(namespace_name, annotation_key, annotation_value, dry_run):
        if dry_run:
            print(f"  WOULD annotate namespace {namespace_name}: {annotation_key}={annotation_value}")
            return
        run_oc(["annotate", "namespace", namespace_name, f"{annotation_key}={annotation_value}", "--overwrite"])


    def apply_payload(namespace_name, payload, dry_run):
        if dry_run:
            print(f"  WOULD apply rendered manifests to namespace {namespace_name}")
            return
        run_oc(["apply", "-f", "-"], input_text=payload)


    def bootstrap_namespace(namespace, files, annotation_key, annotation_value, dry_run):
        payload = build_manifest_payload(files, namespace)
        apply_payload(namespace.name, payload, dry_run)
        annotate_namespace(namespace.name, annotation_key, annotation_value, dry_run)


    def parse_args():
        parser = argparse.ArgumentParser(description="Bootstrap resources into Dev Spaces user namespaces.")
        parser.add_argument("--manifests-dir", required=True)
        parser.add_argument("--selector", default=DEFAULT_SELECTOR)
        parser.add_argument("--annotation-key", default=DEFAULT_BOOTSTRAP_ANNOTATION)
        parser.add_argument("--annotation-value", default=DEFAULT_BOOTSTRAP_VALUE)
        parser.add_argument("--user", action="append", default=[])
        parser.add_argument("--include-bootstrapped", action="store_true")
        parser.add_argument("--dry-run", action="store_true")
        return parser.parse_args()


    def main():
        args = parse_args()
        files = collect_yaml_files(args.manifests_dir)
        user_filter = set(args.user)
        namespaces = list_devspaces_namespaces(args.selector, args.annotation_key)
        if user_filter:
            namespaces = [ns for ns in namespaces if ns.username in user_filter]
        if not namespaces:
            print("No matching Dev Spaces namespaces found.")
            return 0

        processed = 0
        skipped = 0
        for namespace in namespaces:
            if not namespace.username:
                print(f"SKIP {namespace.name}: missing che.eclipse.org/username annotation")
                skipped += 1
                continue
            if namespace.bootstrap_state == args.annotation_value and not args.include_bootstrapped:
                print(f"SKIP {namespace.name}: already bootstrapped")
                skipped += 1
                continue
            print(f"BOOTSTRAP {namespace.name} (user={namespace.username})")
            bootstrap_namespace(
                namespace,
                files,
                args.annotation_key,
                args.annotation_value,
                args.dry_run,
            )
            processed += 1

        print(f"\nProcessed: {processed}")
        print(f"Skipped:   {skipped}")
        return 0


    if __name__ == "__main__":
        try:
            raise SystemExit(main())
        except subprocess.CalledProcessError as exc:
            if exc.stdout:
                sys.stdout.write(exc.stdout)
            if exc.stderr:
                sys.stderr.write(exc.stderr)
            raise SystemExit(exc.returncode)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-devspaces-manifests
  namespace: workshop-helpers
data:
  example-configmap.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${USERNAME}-bootstrap-example
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/managed-by: workshop-bootstrap
    data:
      username: ${USERNAME}
      namespace: ${NAMESPACE}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get"]
  - apiGroups: ["rhdh.redhat.com"]
    resources: ["backstages"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-helpers
  labels:
    app: workshop-helpers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-helpers
subjects:
  - kind: ServiceAccount
    name: workshop-helpers
    namespace: workshop-helpers

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: provision-user-repos-gitlab
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: provision
              image: python:3.11
              command: ["/bin/bash", "-c"]
              args:
                - |
                  pip install --quiet --target /tmp/pylib requests pyyaml urllib3 && export PYTHONPATH=/tmp/pylib && \
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  git clone --depth 1 https://github.com/na-launch-workshop/platform-software-templates.git /tmp/workspace && \
                  python3 /tmp/workspace/workshop/scripts/provision-user-repos-gitlab.py

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bootstrap-devspaces-namespaces
  namespace: workshop-helpers
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: workshop-helpers
          restartPolicy: OnFailure
          containers:
            - name: bootstrap
              image: python:3.11
              command: ["/bin/bash", "-c"]
              args:
                - |
                  curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                    | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
                  python3 /bootstrap/bootstrap-devspaces-namespaces.py \
                    --manifests-dir /bootstrap-manifests
              volumeMounts:
                - name: bootstrap-script
                  mountPath: /bootstrap
                - name: bootstrap-manifests
                  mountPath: /bootstrap-manifests
          volumes:
            - name: bootstrap-script
              configMap:
                name: bootstrap-devspaces-script
                defaultMode: 493
            - name: bootstrap-manifests
              configMap:
                name: bootstrap-devspaces-manifests

---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-devspaces-namespaces-once
  namespace: workshop-helpers
spec:
  template:
    spec:
      serviceAccountName: workshop-helpers
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: python:3.11
          command: ["/bin/bash", "-c"]
          args:
            - |
              curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz \
                | tar -xz -C /tmp oc && export PATH=/tmp:$PATH && \
              python3 /bootstrap/bootstrap-devspaces-namespaces.py \
                --manifests-dir /bootstrap-manifests
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
            - name: bootstrap-manifests
              mountPath: /bootstrap-manifests
      volumes:
        - name: bootstrap-script
          configMap:
            name: bootstrap-devspaces-script
            defaultMode: 493
        - name: bootstrap-manifests
          configMap:
            name: bootstrap-devspaces-manifests
  backoffLimit: 1





#   ------------------------------------------------
#   TO USE
#   oc apply -f ./workshop-scripts.yaml

#   TO REMOVE
#   oc delete namespace workshop-helpers
#   oc delete clusterrole workshop-helpers
#   oc delete clusterrolebinding workshop-helpers
#   ------------------------------------------------

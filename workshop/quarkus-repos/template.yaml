      if: ${{ not steps['check-funqy'].output.entity }}
      input:
        url: ./skeleton
        targetPath: ./workshop-quarkus-using_funqy_stateless_events
        values:
          repoName: workshop-quarkus-using_funqy_stateless_events
          title: using_funqy_stateless_events
          gitlabUsername: ${{ user.entity.metadata.name }}
          devspacesUrl: "https://devspaces.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/#https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-using_funqy_stateless_events"

    - id: publish-funqy
      name: Publish using_funqy_stateless_events → GitLab
      action: publish:gitlab
      if: ${{ not steps['check-funqy'].output.entity }}
      input:
        repoUrl: "gitlab.com?owner=${{ user.entity.metadata.name }}&repo=workshop-quarkus-using_funqy_stateless_events"
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./workshop-quarkus-using_funqy_stateless_events

    - id: register-funqy
      name: Register using_funqy_stateless_events in catalog
      action: catalog:register
      if: ${{ not steps['check-funqy'].output.entity }}
      input:
        catalogInfoUrl: "https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-using_funqy_stateless_events/-/blob/main/catalog-info.yaml"

    # ── Repo 4: blue_green_deployments_openshift ──────────────────────────
    - id: check-blue-green
      name: Check if blue_green_deployments_openshift already set up
      action: catalog:fetch
      input:
        optional: true
        entityRef: "component:default/workshop-quarkus-blue_green_deployments_openshift"

    - id: fetch-blue-green
      name: Fetch blue_green_deployments_openshift
      action: fetch:plain
      if: ${{ not steps['check-blue-green'].output.entity }}
      input:
        url: https://gitea.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/workshop-source/workshop-quarkus-blue_green_deployments_openshift/src/branch/main
        targetPath: ./workshop-quarkus-blue_green_deployments_openshift

    - id: catalog-blue-green
      name: Add catalog-info to blue_green_deployments_openshift
      action: fetch:template
      if: ${{ not steps['check-blue-green'].output.entity }}
      input:
        url: ./skeleton
        targetPath: ./workshop-quarkus-blue_green_deployments_openshift
        values:
          repoName: workshop-quarkus-blue_green_deployments_openshift
          title: blue_green_deployments_openshift
          gitlabUsername: ${{ user.entity.metadata.name }}
          devspacesUrl: "https://devspaces.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/#https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-blue_green_deployments_openshift"

    - id: publish-blue-green
      name: Publish blue_green_deployments_openshift → GitLab
      action: publish:gitlab
      if: ${{ not steps['check-blue-green'].output.entity }}
      input:
        repoUrl: "gitlab.com?owner=${{ user.entity.metadata.name }}&repo=workshop-quarkus-blue_green_deployments_openshift"
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./workshop-quarkus-blue_green_deployments_openshift

    - id: register-blue-green
      name: Register blue_green_deployments_openshift in catalog
      action: catalog:register
      if: ${{ not steps['check-blue-green'].output.entity }}
      input:
        catalogInfoUrl: "https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-blue_green_deployments_openshift/-/blob/main/catalog-info.yaml"

    # ── Repo 5: openshift_telemetry_with_micrometer ───────────────────────
    - id: check-telemetry
      name: Check if openshift_telemetry_with_micrometer already set up
      action: catalog:fetch
      input:
        optional: true
        entityRef: "component:default/workshop-quarkus-openshift_telemetry_with_micrometer"

    - id: fetch-telemetry
      name: Fetch openshift_telemetry_with_micrometer
      action: fetch:plain
      if: ${{ not steps['check-telemetry'].output.entity }}
      input:
        url: https://gitea.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/workshop-source/workshop-quarkus-openshift_telemetry_with_micrometer/src/branch/main
        targetPath: ./workshop-quarkus-openshift_telemetry_with_micrometer

    - id: catalog-telemetry
      name: Add catalog-info to openshift_telemetry_with_micrometer
      action: fetch:template
      if: ${{ not steps['check-telemetry'].output.entity }}
      input:
        url: ./skeleton
        targetPath: ./workshop-quarkus-openshift_telemetry_with_micrometer
        values:
          repoName: workshop-quarkus-openshift_telemetry_with_micrometer
          title: openshift_telemetry_with_micrometer
          gitlabUsername: ${{ user.entity.metadata.name }}
          devspacesUrl: "https://devspaces.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/#https://gitlab.apps.rosa.rosa-bvwwp.naah.p3.openshiftapps.com/${{ user.entity.metadata.name }}/workshop-quarkus-openshift_telemetry_with_micrometer"

    - id: publish-telemetry
      name: Publish openshift_telemetry_with_micrometer → GitLab
      action: publish:gitlab
      if: ${{ not steps['check-telemetry'].output.entity }}
      input:
        repoUrl: "gitlab.com?owner=${{ user.entity.metadata.name }}&repo=workshop-quarkus-openshift_telemetry_with_micrometer"
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./workshop-quarkus-openshift_telemetry_with_micrometer

    - id: register-telemetry
      name: Register openshift_telemetry_with_micrometer in catalog
      action: catalog:register
      if: ${{ not steps['check-telemetry'].output.entity }}
      input:
